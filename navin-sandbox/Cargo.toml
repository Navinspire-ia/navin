[package]
name = "navin-sandbox"
version = "0.1.0"
edition = "2021"
description = "OS-level command sandbox for the navin agent (Landlock + namespaces)"
license = "MIT"

[[bin]]
name = "navin-sandbox"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
