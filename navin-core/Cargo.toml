[package]
name = "navin-core"
version = "0.1.0"
edition = "2021"
description = "Native (Rust) hot paths for the navin agent tools"
license = "AGPL-3.0-only"

[lib]
name = "navin_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1"
rayon = "1"
memmap2 = "0.9"
blake3 = { version = "1", features = ["rayon"] }
sysinfo = "0.33"
portable-pty = "0.8"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2"
tree-sitter = "0.26.11"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
tantivy = "0.26.1"
# Scrape hot path (fetch / extract / clean / export)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli"] }
scraper = "0.23"
url = "2"
csv = "1"
rust_xlsxwriter = "0.97"

[profile.release]
lto = true
codegen-units = 1
