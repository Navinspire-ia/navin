<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hero_intro</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/navin-motion.css">
<script type="importmap">{"imports":{"three":"../assets/three.module.min.js","three/addons/":"../assets/addons/"}}</script>
<script src="../assets/gsap.min.js"></script>
<script src="../assets/navin-motion.js"></script>
<style>
  .hi-copy {
    position: absolute; left: 0; right: 0; bottom: 11%;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: calc(var(--u) * 18); padding: 0 calc(var(--u) * 100);
  }
  .nm-portrait .hi-copy { bottom: 17%; }
  .hi-headline { font-size: calc(var(--u) * 92); max-width: 18ch; text-wrap: balance; }
  .nm-portrait .hi-headline { font-size: calc(var(--u) * 96); max-width: 11ch; }
  .hi-sub { font-size: calc(var(--u) * 34); max-width: 34ch; text-wrap: balance; }
  .hi-flare {
    position: absolute; left: 50%; top: 42%; width: 140%; height: calc(var(--u) * 6);
    transform: translate(-50%, -50%) rotate(-8deg);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c-accent) 70%, white), transparent);
    opacity: 0; mix-blend-mode: screen;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="nm-backdrop"></div>
  <div class="hi-flare"></div>
  <div class="hi-copy">
    <div class="nm-eyebrow hi-eyebrow"></div>
    <h1 class="nm-heading hi-headline"></h1>
    <p class="nm-sub hi-sub"></p>
  </div>
  <div class="nm-grain"></div>
  <div class="nm-vignette"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';

const NM = window.NavinMotion;

NM.mount({
  duration: 5,
  async setup(nm) {
    const { brand, canvas, duration } = nm;
    const c = brand.colors;
    const renderer = nm.three(THREE, { alpha: true, exposure: 1.05 });
    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.4;

    const aspect = canvas.width / canvas.height;
    const camera = new THREE.PerspectiveCamera(32, aspect, 0.1, 100);

    // Face art: product image if given, else the logo (or a wordmark).
    const imageUrl = nm.prop('image', '');
    let faceEl;
    if (imageUrl) faceEl = await nm.media(imageUrl, { at: 0, start: Number(nm.prop('video_start', 0)) });
    else faceEl = await nm.logoCanvas({ size: 1024 });
    const faceSize = nm.mediaSize(faceEl);
    const faceAspect = faceSize.w / faceSize.h;

    let slabW, slabH, faceW, faceH;
    if (imageUrl) {
      slabW = faceAspect >= 1 ? 3.2 : 3.2 * Math.max(0.56, faceAspect);
      slabH = slabW / faceAspect;
      if (slabH > 2.3) { slabH = 2.3; slabW = slabH * faceAspect; }
      faceW = slabW - 0.08; faceH = slabH - 0.08;
    } else {
      faceW = Math.min(2.4, 1.3 * Math.max(1, faceAspect));
      faceH = faceW / faceAspect;
      if (faceH > 1.1) { faceH = 1.1; faceW = faceH * faceAspect; }
      slabW = Math.max(faceW + 0.9, 2.2);
      slabH = Math.max(faceH + 0.9, 1.4);
    }

    const group = new THREE.Group();
    scene.add(group);
    const slabColor = new THREE.Color(nm.mix(c.background, c.primary, 0.16));
    const slab = new THREE.Mesh(
      new RoundedBoxGeometry(slabW, slabH, 0.22, 8, 0.12),
      new THREE.MeshPhysicalMaterial({
        color: slabColor, metalness: 0.35, roughness: 0.22,
        clearcoat: 1, clearcoatRoughness: 0.06, iridescence: 0.25,
        iridescenceIOR: 1.4,
      })
    );
    group.add(slab);

    const faceTex = nm.texture(THREE, faceEl);
    if (imageUrl) nm.coverTexture(faceTex, faceAspect, faceW / faceH);
    const face = new THREE.Mesh(
      new THREE.PlaneGeometry(faceW, faceH),
      new THREE.MeshPhysicalMaterial({
        map: faceTex, transparent: !imageUrl, roughness: imageUrl ? 0.35 : 0.2,
        metalness: imageUrl ? 0 : 0.2, clearcoat: 1, clearcoatRoughness: 0.05,
        emissive: new THREE.Color(0xffffff), emissiveMap: faceTex,
        emissiveIntensity: imageUrl ? 0.55 : 0.35,
      })
    );
    face.position.z = 0.111;
    group.add(face);

    // Accent edge glow ring behind the slab.
    const halo = new THREE.Mesh(
      new THREE.PlaneGeometry(slabW * 2.4, slabH * 2.4),
      new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: { uColor: { value: new THREE.Color(c.primary) }, uK: { value: 0 } },
        vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader: 'uniform vec3 uColor; uniform float uK; varying vec2 vUv; void main(){ float d=length(vUv-0.5)*2.0; float a=exp(-d*d*4.0)*uK; gl_FragColor=vec4(uColor*a,a); }',
      })
    );
    halo.position.z = -0.6;
    group.add(halo);

    // Lights: key sweeps across the clearcoat, rim in accent, fill in secondary.
    scene.add(new THREE.AmbientLight(0xffffff, 0.15));
    const key = new THREE.SpotLight(0xffffff, 120, 30, Math.PI / 7, 0.6, 1.4);
    key.position.set(-6, 3, 6);
    key.target = group;
    scene.add(key);
    const rim = new THREE.PointLight(new THREE.Color(c.accent), 40, 20, 1.6);
    rim.position.set(3.5, 2.2, -2.5);
    scene.add(rim);
    const fill = new THREE.PointLight(new THREE.Color(c.secondary), 18, 20, 1.6);
    fill.position.set(-4, -2.5, 3);
    scene.add(fill);

    // Floating dust particles (seeded Math.random, so identical every render).
    const COUNT = 360;
    const base = new Float32Array(COUNT * 3);
    const speed = new Float32Array(COUNT);
    for (let i = 0; i < COUNT; i++) {
      base[i * 3] = (Math.random() - 0.5) * 14;
      base[i * 3 + 1] = (Math.random() - 0.5) * 9;
      base[i * 3 + 2] = -6 + Math.random() * 9;
      speed[i] = 0.05 + Math.random() * 0.18;
    }
    const pos = new Float32Array(base);
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const dot = document.createElement('canvas');
    dot.width = dot.height = 64;
    const g2 = dot.getContext('2d');
    const grad = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g2.fillStyle = grad;
    g2.fillRect(0, 0, 64, 64);
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      size: 0.05, map: new THREE.CanvasTexture(dot), transparent: true, depthWrite: false,
      opacity: 0, color: new THREE.Color(nm.mix(c.text, c.secondary, 0.3)), blending: THREE.AdditiveBlending,
    }));
    scene.add(dust);

    // Fit the slab in frame on every format; leave room for copy.
    const hasCopy = !!(nm.prop('headline', '') || nm.prop('subheadline', ''));
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const fitW = slabW / (0.5 * 2 * Math.tan(vfov / 2) * aspect);
    const fitH = slabH / ((hasCopy ? 0.42 : 0.55) * 2 * Math.tan(vfov / 2));
    const restZ = Math.max(fitW, fitH, 4.5);
    const lift = hasCopy ? restZ * Math.tan(vfov / 2) * (canvas.portrait ? 0.32 : 0.24) : 0;

    // Copy.
    const eyebrow = document.querySelector('.hi-eyebrow');
    const headline = document.querySelector('.hi-headline');
    const sub = document.querySelector('.hi-sub');
    eyebrow.textContent = nm.prop('eyebrow', '');
    headline.textContent = nm.prop('headline', '');
    sub.textContent = nm.prop('subheadline', '');
    [eyebrow, headline, sub].forEach((el) => { if (!el.textContent) el.style.display = 'none'; });
    const words = headline.textContent ? nm.split(headline, 'words') : [];

    const state = { camZ: restZ * 1.9, camX: -1.4, camY: 0.9, rotY: -1.05, rotX: 0.42, keyX: -7, halo: 0, dust: 0, spin: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.to(state, { camZ: restZ, camX: 0.35, camY: 0.15, duration: 2.6, ease: 'expo.out' }, 0);
    tl.to(state, { rotY: -0.16, rotX: 0.06, duration: 2.4, ease: 'expo.out' }, 0.05);
    tl.to(state, { keyX: 7, duration: 2.2, ease: 'power2.inOut' }, 0.35);
    tl.to(state, { halo: 1, duration: 1.4, ease: 'power2.out' }, 0.5);
    tl.to(state, { dust: 0.85, duration: 1.2, ease: 'power1.out' }, 0.2);
    tl.to(state, { spin: 1, duration: duration, ease: 'none' }, 0);
    tl.fromTo('.hi-flare', { opacity: 0, xPercent: -30 }, { opacity: 0.85, xPercent: 0, duration: 0.6, ease: 'power2.out' }, 0.9);
    tl.to('.hi-flare', { opacity: 0, xPercent: 25, duration: 0.9, ease: 'power2.in' }, 1.5);
    tl.fromTo('.nm-backdrop', { scale: 1.12 }, { scale: 1, duration: duration, ease: 'sine.out' }, 0);
    const copyAt = Math.min(1.25, duration * 0.3);
    if (eyebrow.textContent) tl.from(eyebrow, { y: nm.px(20), opacity: 0, duration: 0.7, ease: 'expo.out' }, copyAt);
    if (words.length) tl.from(words, { yPercent: 115, duration: 0.95, ease: 'expo.out', stagger: 0.06 }, copyAt + 0.1);
    if (sub.textContent) tl.from(sub, { y: nm.px(26), opacity: 0, duration: 0.9, ease: 'expo.out' }, copyAt + 0.45);
    tl.set({}, {}, duration);

    return {
      timeline: tl,
      render(t) {
        camera.position.set(state.camX, state.camY + lift * 0.0, state.camZ);
        camera.lookAt(0, 0, 0);
        group.position.y = lift;
        group.rotation.set(state.rotX + Math.sin(t * 0.9) * 0.015, state.rotY + state.spin * 0.12, 0);
        key.position.x = state.keyX;
        halo.material.uniforms.uK.value = state.halo * 0.55;
        dust.material.opacity = state.dust;
        for (let i = 0; i < COUNT; i++) {
          pos[i * 3 + 1] = base[i * 3 + 1] + speed[i] * t;
          pos[i * 3] = base[i * 3] + Math.sin(t * speed[i] * 3 + i) * 0.08;
        }
        dustGeo.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
      },
    };
  },
});
</script>
</body>
</html>
