<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>device_mockup_3d</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/navin-motion.css">
<script type="importmap">{"imports":{"three":"../assets/three.module.min.js","three/addons/":"../assets/addons/"}}</script>
<script src="../assets/gsap.min.js"></script>
<script src="../assets/navin-motion.js"></script>
<style>
  .dm-copy {
    position: absolute; left: 0; right: 0; bottom: 8%;
    display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 8%;
  }
  .nm-portrait .dm-copy { bottom: 11%; }
  .dm-headline { font-size: calc(var(--u) * 72); max-width: 20ch; text-wrap: balance; }
  .nm-portrait .dm-headline { font-size: calc(var(--u) * 84); max-width: 12ch; }
</style>
</head>
<body>
<div id="stage">
  <div class="nm-backdrop"></div>
  <div class="dm-copy"><h1 class="nm-heading dm-headline"></h1></div>
  <div class="nm-grain"></div>
  <div class="nm-vignette"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';

const NM = window.NavinMotion;

const SCREEN_VERT = 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }';
const SCREEN_FRAG = `
uniform sampler2D map;
uniform float uRadius;
uniform float uAspect;
uniform vec2 uRepeat;
uniform vec2 uOffset;
uniform float uDim;
varying vec2 vUv;
float rbox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r; }
void main(){
  vec2 p=(vUv-0.5)*vec2(uAspect,1.0);
  float d=rbox(p,vec2(uAspect*0.5,0.5),uRadius);
  float a=1.0-smoothstep(-0.0025,0.0025,d);
  vec4 c=texture2D(map,vUv*uRepeat+uOffset);
  float glare=0.06*smoothstep(0.2,0.9,vUv.y+0.35*vUv.x);
  gl_FragColor=vec4(c.rgb*uDim+glare*uDim,a);
  #include <colorspace_fragment>
}`;

function screenMaterial(THREE, tex, planeAspect, mediaAspect, radius) {
  const repeat = new THREE.Vector2(1, 1);
  const offset = new THREE.Vector2(0, 0);
  if (mediaAspect > planeAspect) { repeat.x = planeAspect / mediaAspect; offset.x = (1 - repeat.x) / 2; }
  else { repeat.y = mediaAspect / planeAspect; offset.y = (1 - repeat.y) / 2; }
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: tex }, uRadius: { value: radius }, uAspect: { value: planeAspect },
      uRepeat: { value: repeat }, uOffset: { value: offset }, uDim: { value: 1 },
    },
    vertexShader: SCREEN_VERT, fragmentShader: SCREEN_FRAG, transparent: true, toneMapped: false,
  });
}

function shadowTexture(THREE) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.75)');
  grad.addColorStop(0.55, 'rgba(0,0,0,0.3)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

function urlTexture(THREE, nm, text) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.beginPath(); g.roundRect(0, 0, 1024, 64, 32); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.78)';
  g.font = '500 30px Inter, sans-serif';
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  g.fillText(text, 512, 33);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

NM.mount({
  duration: 6,
  async setup(nm) {
    const { brand, canvas, duration } = nm;
    const c = brand.colors;
    const url = nm.prop('media', '') || nm.prop('image', '') || nm.prop('video', '');
    if (!url) throw new Error('device_mockup_3d needs props.media (image or clip)');
    const media = await nm.media(url, { start: Number(nm.prop('video_start', 0)), at: 0 });
    const ms = nm.mediaSize(media);
    const mediaAspect = ms.w / ms.h;
    const tex = nm.texture(THREE, media);

    const renderer = nm.three(THREE, { alpha: true, exposure: 1.0 });
    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.7;
    const aspect = canvas.width / canvas.height;
    const camera = new THREE.PerspectiveCamera(30, aspect, 0.1, 100);

    scene.add(new THREE.AmbientLight(0xffffff, 0.2));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(-3, 5, 4);
    scene.add(key);
    const rim = new THREE.PointLight(new THREE.Color(c.accent), 30, 20, 1.5);
    rim.position.set(3, 2.5, -3);
    scene.add(rim);
    const fill = new THREE.PointLight(new THREE.Color(c.primary), 22, 20, 1.5);
    fill.position.set(-3.5, 0.5, 2.5);
    scene.add(fill);

    const device = (nm.prop('device', 'laptop') + '').toLowerCase();
    const root = new THREE.Group();
    scene.add(root);
    const metal = new THREE.MeshPhysicalMaterial({ color: 0x3b3e46, metalness: 0.85, roughness: 0.32, clearcoat: 0.4, clearcoatRoughness: 0.3 });
    const black = new THREE.MeshStandardMaterial({ color: 0x050507, roughness: 0.4, metalness: 0.2 });
    let screenMat;
    let lid = null;
    let size;
    let shadowY;
    let centerY;

    if (device === 'phone') {
      const body = new THREE.Mesh(new RoundedBoxGeometry(1.0, 2.08, 0.09, 6, 0.13), new THREE.MeshPhysicalMaterial({ color: 0x24262c, metalness: 0.8, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.1 }));
      root.add(body);
      const sw = 0.93; const sh = 2.01;
      screenMat = screenMaterial(THREE, tex, sw / sh, mediaAspect, 0.11);
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), screenMat);
      screen.position.z = 0.0455;
      root.add(screen);
      const island = new THREE.Mesh(new RoundedBoxGeometry(0.27, 0.075, 0.01, 4, 0.037), black);
      island.position.set(0, 0.91, 0.05);
      root.add(island);
      size = { w: 1.0, h: 2.08 };
      shadowY = -1.25; centerY = 0;
    } else if (device === 'browser') {
      const pw = 3.4; const ph = 2.3;
      const panel = new THREE.Mesh(new RoundedBoxGeometry(pw, ph, 0.05, 4, 0.05), new THREE.MeshPhysicalMaterial({ color: new THREE.Color(nm.mix(c.background, '#ffffff', 0.08)), metalness: 0.1, roughness: 0.5, clearcoat: 0.6 }));
      root.add(panel);
      const barH = 0.17;
      const dots = ['#FF5F57', '#FEBC2E', '#28C840'];
      dots.forEach((col, i) => {
        const d = new THREE.Mesh(new THREE.CircleGeometry(0.028, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(col) }));
        d.position.set(-pw / 2 + 0.12 + i * 0.09, ph / 2 - barH / 2 - 0.01, 0.027);
        root.add(d);
      });
      const urlText = String(nm.prop('url', brand.url || 'app.' + (brand.name || 'navin').toLowerCase().replace(/\s+/g, '') + '.com'));
      const pill = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.094), new THREE.MeshBasicMaterial({ map: urlTexture(THREE, nm, urlText), transparent: true, toneMapped: false }));
      pill.position.set(0, ph / 2 - barH / 2 - 0.01, 0.027);
      root.add(pill);
      const cw = pw - 0.06; const ch = ph - barH - 0.06;
      screenMat = screenMaterial(THREE, tex, cw / ch, mediaAspect, 0.03);
      const content = new THREE.Mesh(new THREE.PlaneGeometry(cw, ch), screenMat);
      content.position.set(0, -barH / 2 + 0.0, 0.027);
      root.add(content);
      size = { w: pw, h: ph };
      shadowY = -1.45; centerY = 0;
    } else {
      // Laptop: base + hinged lid that opens during the intro.
      const base = new THREE.Mesh(new RoundedBoxGeometry(3.2, 0.1, 2.2, 4, 0.045), metal);
      base.position.y = 0;
      root.add(base);
      const deck = new THREE.Mesh(new THREE.PlaneGeometry(2.75, 1.05), new THREE.MeshStandardMaterial({ color: 0x15161b, roughness: 0.85 }));
      deck.rotation.x = -Math.PI / 2; deck.position.set(0, 0.051, -0.38);
      root.add(deck);
      const pad = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 0.66), new THREE.MeshStandardMaterial({ color: 0x4a4d56, roughness: 0.45, metalness: 0.6 }));
      pad.rotation.x = -Math.PI / 2; pad.position.set(0, 0.051, 0.6);
      root.add(pad);
      lid = new THREE.Group();
      lid.position.set(0, 0.05, -1.08);
      root.add(lid);
      const shell = new THREE.Mesh(new RoundedBoxGeometry(3.2, 2.08, 0.06, 4, 0.04), metal);
      shell.position.set(0, 1.04, 0);
      lid.add(shell);
      const bezel = new THREE.Mesh(new THREE.PlaneGeometry(3.12, 2.0), black);
      bezel.position.set(0, 1.04, 0.0305);
      lid.add(bezel);
      const sw = 2.96; const sh = 1.85;
      screenMat = screenMaterial(THREE, tex, sw / sh, mediaAspect, 0.02);
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), screenMat);
      screen.position.set(0, 1.06, 0.031);
      lid.add(screen);
      size = { w: 3.2, h: 2.4 };
      shadowY = -0.06; centerY = 0.95;
    }

    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(size.w * 1.5, size.w * (device === 'laptop' ? 1.1 : 0.45)),
      new THREE.MeshBasicMaterial({ map: shadowTexture(THREE), transparent: true, depthWrite: false, opacity: 0.85 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = shadowY;
    root.add(shadow);

    // Fit to frame; leave room for the headline.
    const headline = document.querySelector('.dm-headline');
    headline.textContent = nm.prop('headline', '');
    const hasCopy = !!headline.textContent;
    if (!hasCopy) headline.style.display = 'none';
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const fill2 = hasCopy ? 0.56 : 0.7;
    const R = Math.max(size.w / (0.74 * 2 * Math.tan(vfov / 2) * aspect), size.h / (fill2 * 2 * Math.tan(vfov / 2)), 3.2);
    const lookY = centerY - (hasCopy ? R * Math.tan(vfov / 2) * (canvas.portrait ? 0.3 : 0.22) : 0);

    const move = (nm.prop('camera', 'orbit') + '').toLowerCase();
    const st = { angle: move === 'orbit' ? -0.6 : move === 'push' ? -0.28 : 0, dist: move === 'push' ? R * 1.4 : R * 1.08, elev: 0.32, rise: -0.9, scale: 0.9, lid: 1.5, dim: 0, rx: 0, ry: 0 };
    if (move === 'tilt') { st.rx = 0.45; st.ry = -0.55; }
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('.nm-backdrop', { scale: 1.12 }, { scale: 1, duration, ease: 'sine.out' }, 0);
    tl.to(st, { rise: 0, scale: 1, duration: 1.3, ease: 'expo.out' }, 0);
    if (lid) {
      tl.to(st, { lid: -0.24, duration: 1.5, ease: 'power3.inOut' }, 0.25);
      tl.to(st, { dim: 1, duration: 0.6, ease: 'power2.out' }, 1.2);
    } else {
      tl.to(st, { dim: 1, duration: 0.7, ease: 'power2.out' }, 0.35);
    }
    if (move === 'orbit') tl.to(st, { angle: 0.32, elev: 0.18, dist: R, duration, ease: 'sine.inOut' }, 0);
    else if (move === 'push') tl.to(st, { dist: R * 0.92, elev: 0.14, duration: duration, ease: 'expo.out' }, 0);
    else tl.to(st, { rx: 0.08, ry: -0.18, dist: R, elev: 0.12, duration, ease: 'power2.out' }, 0);
    if (hasCopy) {
      const words = nm.split(headline, 'words');
      tl.from(words, { yPercent: 115, duration: 0.9, ease: 'expo.out', stagger: 0.06 }, Math.min(1.1, duration * 0.3));
    }
    tl.set({}, {}, duration);

    return {
      timeline: tl,
      render(t) {
        root.position.y = st.rise;
        root.scale.setScalar(st.scale);
        root.rotation.set(st.rx, st.ry + Math.sin(t * 0.6) * 0.02, 0);
        if (lid) lid.rotation.x = st.lid;
        screenMat.uniforms.uDim.value = st.dim;
        camera.position.set(Math.sin(st.angle) * st.dist, centerY + st.elev * st.dist, Math.cos(st.angle) * st.dist);
        camera.lookAt(0, lookY + (centerY - lookY) * 0.0, 0);
        renderer.render(scene, camera);
      },
    };
  },
});
</script>
</body>
</html>
