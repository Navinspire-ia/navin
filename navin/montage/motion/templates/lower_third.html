<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lower_third</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/navin-motion.css">
<script src="../assets/gsap.min.js"></script>
<script src="../assets/navin-motion.js"></script>
<style>
  html, body { background: transparent; }
  .lt-box { position: absolute; bottom: 12%; display: flex; align-items: stretch; gap: calc(var(--u) * 18); }
  .nm-portrait .lt-box { bottom: 18%; }
  .lt-box.left { left: 6%; }
  .lt-box.right { right: 6%; flex-direction: row-reverse; text-align: right; }
  .lt-accent { width: calc(var(--u) * 8); border-radius: 99px; background: linear-gradient(180deg, var(--c-accent), var(--c-primary)); transform-origin: 50% 100%; }
  .lt-panel {
    position: relative; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 6);
    padding: calc(var(--u) * 22) calc(var(--u) * 34); border-radius: calc(var(--u) * 18);
    background: color-mix(in srgb, var(--c-bg) 82%, transparent);
    border: 1px solid var(--c-line);
    box-shadow: 0 calc(var(--u) * 24) calc(var(--u) * 60) rgba(0, 0, 0, 0.35);
  }
  .lt-name { font-family: var(--font-heading); font-weight: 750; font-size: calc(var(--u) * 52); letter-spacing: -0.025em; line-height: 1.05; white-space: nowrap; color: var(--c-text); }
  .lt-role { font-size: calc(var(--u) * 30); color: var(--c-muted); font-weight: 500; white-space: nowrap; }
  .lt-mask { overflow: hidden; padding-bottom: 0.08em; margin-bottom: -0.08em; }
</style>
</head>
<body>
<div id="stage">
  <div class="lt-box">
    <div class="lt-accent"></div>
    <div class="lt-panel">
      <div class="lt-mask"><div class="lt-name"></div></div>
      <div class="lt-mask"><div class="lt-role"></div></div>
    </div>
  </div>
</div>
<script>
const NM = window.NavinMotion;

NM.mount({
  duration: 5,
  setup(nm) {
    const { canvas, duration } = nm;
    if (!canvas.transparent || nm.prop('background', false)) {
      const bg = document.createElement('div');
      bg.className = 'nm-backdrop';
      document.getElementById('stage').prepend(bg);
    }
    const box = document.querySelector('.lt-box');
    box.classList.add(nm.prop('position', 'left') === 'right' ? 'right' : 'left');
    const name = document.querySelector('.lt-name');
    const role = document.querySelector('.lt-role');
    name.textContent = nm.prop('name', nm.brand.name || '');
    role.textContent = nm.prop('role', '');
    if (!role.textContent) role.parentElement.style.display = 'none';
    const fromRight = box.classList.contains('right');

    const tl = gsap.timeline({ paused: true });
    tl.from('.lt-accent', { scaleY: 0, duration: 0.5, ease: 'expo.out' }, 0.1);
    tl.from('.lt-panel', { clipPath: fromRight ? 'inset(0 0 0 100% round 18px)' : 'inset(0 100% 0 0 round 18px)', duration: 0.75, ease: 'expo.inOut' }, 0.2);
    tl.from(name, { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.5);
    if (role.textContent) tl.from(role, { yPercent: 110, duration: 0.7, ease: 'expo.out' }, 0.62);
    const out = Math.max(1.8, duration - 0.75);
    tl.to([name, role], { yPercent: -110, duration: 0.4, ease: 'power3.in', stagger: 0.05 }, out);
    tl.to('.lt-panel', { clipPath: fromRight ? 'inset(0 0 0 100% round 18px)' : 'inset(0 100% 0 0 round 18px)', duration: 0.5, ease: 'expo.in' }, out + 0.15);
    tl.to('.lt-accent', { scaleY: 0, duration: 0.35, ease: 'power3.in' }, out + 0.35);
    tl.set({}, {}, duration);
    gsap.set('.lt-panel', { clipPath: 'inset(0 0% 0 0% round 18px)' });
    return { timeline: tl };
  },
});
</script>
</body>
</html>
