<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gradient_stage</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/navin-motion.css">
<script type="importmap">{"imports":{"three":"../assets/three.module.min.js","three/addons/":"../assets/addons/"}}</script>
<script src="../assets/gsap.min.js"></script>
<script src="../assets/navin-motion.js"></script>
<style>
  .gs-copy {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 calc(var(--u) * 120); gap: calc(var(--u) * 28);
  }
  .gs-title { font-size: calc(var(--u) * 112); max-width: 16ch; text-wrap: balance; }
  .nm-portrait .gs-title { font-size: calc(var(--u) * 104); max-width: 10ch; }
  .gs-sub { font-size: calc(var(--u) * 38); max-width: 30ch; text-wrap: balance; }
</style>
</head>
<body>
<div id="stage">
  <div class="nm-layer gs-copy">
    <div class="nm-eyebrow gs-eyebrow"></div>
    <h1 class="nm-heading gs-title"></h1>
    <p class="nm-sub gs-sub"></p>
  </div>
  <div class="nm-grain"></div>
  <div class="nm-vignette"></div>
</div>
<script type="module">
import * as THREE from 'three';

const NM = window.NavinMotion;

const FRAG = `
precision highp float;
uniform float uTime;
uniform vec2 uRes;
uniform vec3 uBg, uC1, uC2, uC3;
uniform float uIntensity;
uniform float uFade;
varying vec2 vUv;
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
float snoise(vec2 v){
  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
  m=m*m; m=m*m;
  vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5; vec3 ox=floor(x+0.5); vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);
}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 light(vec3 col,vec3 c,vec2 p,vec2 at,float radius,float strength){
  vec2 d=p-at; float w=exp(-dot(d,d)/(radius*radius));
  return mix(col,c,clamp(w*strength,0.0,1.0));
}
void main(){
  vec2 uv=vUv; float aspect=uRes.x/uRes.y;
  vec2 p=vec2((uv.x-0.5)*aspect,uv.y-0.5);
  float t=uTime*0.22;
  p+=0.12*vec2(snoise(p*0.9+vec2(t*0.6,-t*0.4)),snoise(p*0.9+vec2(-t*0.5,t*0.7)+4.0));
  float span=max(aspect,1.0/aspect);
  vec3 col=uBg;
  col=light(col,uC1,p,vec2(-0.42*aspect+0.18*sin(t*1.1),0.28+0.12*cos(t*0.9)),0.62*span,0.95*uIntensity);
  col=light(col,uC2,p,vec2(0.40*aspect+0.16*cos(t*0.8),-0.26+0.14*sin(t*1.3)),0.55*span,0.75*uIntensity);
  col=light(col,uC3,p,vec2(0.12*aspect*sin(t*0.7+1.0),0.42*cos(t*0.6+2.0)),0.38*span,0.45*uIntensity);
  col=light(col,uBg,p,vec2(0.05*sin(t),-0.02),0.30*span,0.55);
  float vig=smoothstep(1.3,0.2,length(p*vec2(1.0/aspect*1.2,1.1)));
  col*=mix(0.62,1.0,vig);
  col=mix(uBg,col,uFade);
  col+=(hash(gl_FragCoord.xy)-0.5)/255.0;
  gl_FragColor=vec4(col,1.0);
}`;

NM.mount({
  duration: 6,
  async setup(nm) {
    const { props, brand, canvas, duration } = nm;
    const renderer = nm.three(THREE, { toneMapping: THREE.NoToneMapping, scale: 0.5, antialias: false });
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const c = brand.colors;
    const uniforms = {
      uTime: { value: 0 },
      uRes: { value: new THREE.Vector2(canvas.width, canvas.height) },
      uBg: { value: new THREE.Color(c.background) },
      uC1: { value: new THREE.Color(c.primary) },
      uC2: { value: new THREE.Color(c.secondary) },
      uC3: { value: new THREE.Color(c.accent) },
      uIntensity: { value: Number(nm.prop('intensity', 1)) },
      uFade: { value: 0 },
    };
    const mat = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }',
      fragmentShader: FRAG,
      depthTest: false,
    });
    // Shader colors are linear; three converts brand sRGB hex to linear, so
    // convert back for a straight sRGB blend in the shader.
    ['uBg', 'uC1', 'uC2', 'uC3'].forEach((k) => uniforms[k].value.convertLinearToSRGB());
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

    const eyebrow = document.querySelector('.gs-eyebrow');
    const title = document.querySelector('.gs-title');
    const sub = document.querySelector('.gs-sub');
    eyebrow.textContent = nm.prop('eyebrow', '');
    title.textContent = nm.prop('title', '');
    sub.textContent = nm.prop('subtitle', '');
    [eyebrow, title, sub].forEach((el) => { if (!el.textContent) el.style.display = 'none'; });

    const speed = Number(nm.prop('speed', 1));
    const tl = gsap.timeline({ paused: true });
    tl.to(uniforms.uFade, { value: 1, duration: 0.8, ease: 'power2.out' }, 0);
    const words = title.textContent ? nm.split(title, 'words') : [];
    if (eyebrow.textContent) tl.from(eyebrow, { y: nm.px(24), opacity: 0, duration: 0.7, ease: 'expo.out' }, 0.25);
    if (words.length) tl.from(words, { yPercent: 115, rotate: 4, duration: 0.9, ease: 'expo.out', stagger: 0.07 }, 0.35);
    if (sub.textContent) tl.from(sub, { y: nm.px(30), opacity: 0, filter: 'blur(8px)', duration: 0.9, ease: 'expo.out' }, 0.75);
    const out = Math.max(1.6, duration - 0.55);
    if (nm.prop('fade_out', true)) {
      tl.to('.gs-copy', { opacity: 0, y: -nm.px(20), duration: 0.5, ease: 'power2.in' }, out);
    }
    tl.set({}, {}, duration);
    return {
      timeline: tl,
      render(t) {
        uniforms.uTime.value = t * speed + Number(nm.prop('seed', 0));
        renderer.render(scene, camera);
      },
    };
  },
});
</script>
</body>
</html>
