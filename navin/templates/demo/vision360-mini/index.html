<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navin Vision 360 Mini</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #12141a;
        --mute: #5b616e;
        --accent: #2563eb;
        --bg: #f4f6fb;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #dbeafe, var(--bg) 45%);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(42rem, calc(100% - 2rem));
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 2.8rem);
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--mute);
        line-height: 1.55;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vision 360 mini site</h1>
      <p>
        Tiny static page bundled with Navin so a first-run audit has something
        real to inspect: structure, accessibility, and shipping readiness.
      </p>
      <p><a href="./about.html">About this demo</a></p>
    </main>
  </body>
</html>
