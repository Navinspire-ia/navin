---
# App Factory build policy: where each target's packages land and which
# tests must pass before a delivery is called "delivered".
# Paths are relative to os/<target>.
version: 1

targets:
  android:
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
    required_tests: [install, start, navigation, api]
  ios:
    artifacts:
      - ios/App/build/**/*.ipa
      - ios/App/build/**/*.app
      - ios/**/export/*.ipa
    required_tests: [install, start, navigation, api]
  windows:
    artifacts:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
      - src-tauri/target/*/release/bundle/msi/*.msi
      - src-tauri/target/*/release/bundle/nsis/*.exe
      # `tauri build --debug` lands under target/debug: a debug package is a
      # real package too (the agent builds debug first because it is faster).
      - src-tauri/target/debug/bundle/msi/*.msi
      - src-tauri/target/debug/bundle/nsis/*.exe
    required_tests: [start, navigation, api]
  macos:
    artifacts:
      - src-tauri/target/release/bundle/dmg/*.dmg
      - src-tauri/target/*/release/bundle/dmg/*.dmg
      - src-tauri/target/release/bundle/macos/*.app
      - src-tauri/target/debug/bundle/dmg/*.dmg
      - src-tauri/target/debug/bundle/macos/*.app
    required_tests: [start, navigation, api]
  ubuntu:
    artifacts:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/*/release/bundle/deb/*.deb
      - src-tauri/target/debug/bundle/deb/*.deb
    required_tests: [start, navigation, api]
  centos:
    artifacts:
      - src-tauri/target/release/bundle/rpm/*.rpm
      - src-tauri/target/*/release/bundle/rpm/*.rpm
      - src-tauri/target/debug/bundle/rpm/*.rpm
    required_tests: [start, navigation, api]
  appimage:
    artifacts:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/*/release/bundle/appimage/*.AppImage
      - src-tauri/target/debug/bundle/appimage/*.AppImage
    required_tests: [start, navigation, api]

# Added to required_tests when the project has a login.
auth_test: auth
# A test reported as passed without evidence is counted as not run.
evidence_required: true
