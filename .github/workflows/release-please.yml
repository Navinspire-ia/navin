name: Release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  SUCCESS_ICON: '<img src="https://api.iconify.design/octicon:check-circle-fill-16.svg?color=%231f883d" width="16" alt="passed" />'
  SKIP_ICON: '<img src="https://api.iconify.design/octicon:skip-16.svg?color=%236e7781" width="16" alt="skipped" />'
  FAIL_ICON: '<img src="https://api.iconify.design/octicon:x-circle-fill-16.svg?color=%23cf222e" width="16" alt="failed" />'

jobs:
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-26.04
    steps:
      - name: Run release-please
        id: release
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          # Do not auto-merge. Maintainers merge chore(release): vX.Y.Z.
          skip-github-pull-request: false

      - name: Write job summary
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.release.outcome }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          python3 <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import os

          success = os.environ["SUCCESS_ICON"]
          skip = os.environ["SKIP_ICON"]
          fail = os.environ["FAIL_ICON"]
          gha_logo = '<img src="https://cdn.simpleicons.org/githubactions/2088FF" width="18" alt="GitHub Actions" />'
          git_logo = '<img src="https://cdn.simpleicons.org/git/F05032" width="18" alt="Git" />'

          outcome = os.environ.get("ACTION_OUTCOME") or "failure"
          job_ok = outcome == "success"
          job_status = f"{success} passed" if job_ok else f"{fail} failed"

          def flag(raw: str, yes: str, no: str) -> str:
              return f"{success} {yes}" if raw == "true" else f"{skip} {no}"

          prs = os.environ.get("PRS_CREATED") or "false"
          releases = os.environ.get("RELEASES_CREATED") or "false"
          paths_raw = os.environ.get("PATHS_RELEASED") or "[]"
          pr_raw = os.environ.get("PR_JSON") or ""

          try:
              paths = json.loads(paths_raw) if paths_raw else []
          except json.JSONDecodeError:
              paths = []
          pr = {}
          if pr_raw.strip():
              try:
                  pr = json.loads(pr_raw)
              except json.JSONDecodeError:
                  pr = {}

          title = pr.get("title") or "(none)"
          number = pr.get("number")
          html_url = pr.get("html_url") or pr.get("url") or ""
          pr_cell = f"[{title}]({html_url})" if html_url else title
          if number and not html_url:
              pr_cell = f"#{number} {title}"

          lines = [
              "| Job | Result | Work covered |",
              "| --- | --- | --- |",
              f"| {gha_logo} Open release PR | {job_status} | Conventional Commits to SemVer; never auto-merge |",
              "",
              "<details>",
              "<summary>Release please details</summary>",
              "",
              "## Action",
              "",
              "| Field | Value |",
              "| --- | --- |",
              f"| Step | {job_status} |",
              f"| Release PR | {flag(prs, 'opened or updated', 'unchanged')} |",
              f"| GitHub release | {flag(releases, 'created', 'not created')} |",
              f"| Paths released | {', '.join(paths) if paths else '(none)'} |",
              "",
              "## Release pull request",
              "",
              "| Field | Value |",
              "| --- | --- |",
              f"| {git_logo} Title | {pr_cell} |",
              "",
              "Maintainers merge `chore(release): vX.Y.Z`. The workflow does not auto-merge.",
              "",
              "</details>",
              "",
          ]
          print("\n".join(lines))
          PY

      - name: Fail job if release-please failed
        if: always() && steps.release.outcome != 'success'
        run: exit 1
