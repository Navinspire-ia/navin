- name: "severity: critical"
  description: Causes data loss, security exposure, or a blocked install.
  color: "#b60205"
- name: "severity: high"
  description: Breaks a primary workflow with no acceptable workaround.
  color: "#d93f0b"
- name: "severity: medium"
  description: Breaks an edge case that has an existing workaround.
  color: "#fbca04"
- name: "severity: low"
  description: Polish or cosmetic issue with no functional impact.
  color: "#0e8a16"
- name: "priority: P0"
  description: Drop everything - blocking or production safety.
  color: "#b60205"
- name: "priority: P1"
  description: Required for the current milestone or MVP.
  color: "#d93f0b"
- name: "priority: P2"
  description: Important but not blocking the current milestone.
  color: "#fbca04"
- name: "priority: P3"
  description: Follow-up or polish, schedule after the current push.
  color: "#0e8a16"
- name: "status: needs-triage"
  description: Awaiting a maintainer to apply area and labels.
  color: "#cccccc"
- name: "status: needs-repro"
  description: Awaiting reproduction steps from the reporter.
  color: "#cccccc"
- name: "status: needs-design"
  description: Awaiting design or scope decision from a maintainer.
  color: "#cccccc"
- name: "status: ready"
  description: Triaged and ready for someone to pick up.
  color: "#cccccc"
- name: "status: in-progress"
  description: Someone is actively working on this issue.
  color: "#cccccc"
- name: "status: blocked"
  description: Work cannot continue until an external dependency clears.
  color: "#cccccc"
- name: "status: wontfix"
  description: Maintainers decided not to address this issue.
  color: "#cccccc"
- name: "status: duplicate"
  description: Already tracked by another open or closed issue.
  color: "#cccccc"
- name: "status: stale"
  description: Inactive for a long period and likely needs a refresh.
  color: "#cccccc"