name: "Question / support"
description: "Ask the community before opening a bug or feature."
title: "[Support]: "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when you need help using Navin, hit confusing behavior, or want to confirm the right way to do something.

        Before you file here:
        - For confirmed bugs with reproducible steps, open a `Bug` report instead.
        - For feature ideas, use the `Feature request` template instead.
        - For security concerns, see `SECURITY.md` and email `security@navinspire.com` - do not post details here.

        Do not paste API keys, tokens, or `~/.navin/config.json` contents in this report.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - CLI (navin-cli)
        - Both desktop and CLI
        - Source / dev checkout
    validations:
      required: true
  - type: input
    id: exact-version
    attributes:
      label: Exact version
      description: "Paste the output of `navin --version` or `navin-cli --version`. Leave blank if you cannot run it."
      placeholder: "2.0.4"
    validations:
      required: false
  - type: dropdown
    id: navin-channel
    attributes:
      label: Release channel
      options:
        - latest stable
        - latest RC
        - nightly / unreleased
        - from source
        - not sure
    validations:
      required: true
  - type: checkboxes
    id: affected-installations
    attributes:
      label: Affected installations
      description: "Tick every packaging channel where you reproduced the issue. Leave blank if unsure; triagers will follow up."
      options:
        - label: Windows .exe setup
        - label: Windows .msi
        - label: macOS Apple Silicon (.dmg)
        - label: macOS Intel (.dmg)
        - label: Linux AppImage
        - label: Linux .deb
        - label: Linux .rpm
        - label: Linux pacman / .pkg.tar.zst
        - label: Linux AUR
        - label: CLI one-liner or archive
        - label: WSL
        - label: Docker
        - label: From source
        - label: Not sure
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: "State the goal, what you tried, and the exact error or unexpected behavior."
      placeholder: "State the goal, what you tried, and the exact error or unexpected behavior."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / context
      description: "Redacted logs (no API keys), screenshots, config snippets - keep secrets out."
      placeholder: "Redacted logs (no API keys), screenshots, config snippets - keep secrets out."
    validations:
      required: true
  - type: textarea
    id: attempted-workarounds
    attributes:
      label: What you already tried
      description: "Show you investigated before filing."
      placeholder: "Same idea - what is the closest thing you have today?"
    validations:
      required: true
  - type: checkboxes
    id: user-agreement
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for this report.
          required: true
        - label: I read [CONTRIBUTING.md](https://github.com/Navinspire-ia/navin/blob/main/CONTRIBUTING.md) and excluded secrets from my report.
          required: true
